<div class="bg-black w-full h-[100vh] p-6 flex justify-center">
  <div
    class="w-full h-full rounded-xl bg-gradient-to-b
           from-[#1a1a1a] to-[#0d0d0d]
           border border-gray-800 shadow-lg
           flex flex-col overflow-hidden"
  >

    <!-- HEADER (FIXED) -->
    <div class="p-8 border-b border-gray-700 shrink-0">

      <!-- TEAM HEADER -->
      <div class="flex items-center gap-6 mb-8">

        <!-- TEAM LOGO -->
        <div
          class="relative w-20 h-20 rounded-xl
           bg-black/60 flex items-center justify-center
           border border-white/10"
        >
          <img
            [src]="data.team?.logo || '/images/icons/team_placeholder.png'"
            alt="Team Logo"
            class="w-14 h-14 object-contain"
          />

          <!-- Soft glow -->
          <div
            class="absolute inset-0 rounded-xl pointer-events-none"
            [ngStyle]="{
        'box-shadow': '0 0 30px ' + data.team?.primaryColor,
        'opacity': '0.25'
      }"
          ></div>
        </div>

        <!-- TEAM NAME + ACCENT -->
        <div class="flex-1">
          <h2
            class="text-white text-5xl font-extrabold tracking-wide leading-tight"
          >
            {{ data.team?.name }}
          </h2>

          <!-- TEAM COLOR ACCENT LINE -->
          <div
            class="mt-2 h-1 w-40 rounded-full animate-accent"
            [ngStyle]="{ 'background-color': data.team?.primaryColor }"
          ></div>
        </div>

      </div>

      <!-- SUMMARY CARDS -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- TOTAL SPENT -->
        <div
          class="bg-green-500/25 border-2 border-green-500
                 rounded-2xl px-8 py-6 shadow-lg"
        >
          <p class="text-green-200 text-xl font-bold uppercase tracking-wider">
            Total Spend
          </p>
          <p class="text-white text-4xl font-extrabold mt-2">
            ₹{{ teamStatus?.totalSpend }}
          </p>
        </div>

        <!-- BUDGET REMAINING -->
        <div
          class="bg-red-500/25 border-2 border-red-500
                 rounded-2xl px-8 py-6 shadow-lg animate-pulse">
          <p class="text-red-200 text-xl font-bold uppercase tracking-wider">
            Remaining Budget
          </p>
          <p class="text-white text-4xl font-extrabold mt-2">
            ₹{{ teamStatus?.availableAmount }}
          </p>
        </div>

        <!-- SQUAD SIZE -->
        <div
          class="bg-blue-500/25 border-2 border-blue-500
                 rounded-2xl px-8 py-6 shadow-lg"
        >
          <p class="text-blue-200 text-xl font-bold uppercase tracking-wider">
            Squad Size
          </p>
          <p class="text-white text-4xl font-extrabold mt-2">
            {{ playersCount || 0 }}
          </p>
        </div>

      </div>
    </div>

    <!-- PLAYERS (SCROLLABLE) -->
    <div class="flex-1 p-6 space-y-10 overflow-y-auto">

      <div *ngFor="let position of objectKeys(teamStatus?.selectedPositions)">
        <!-- POSITION TITLE -->
        <h3 class="text-gray-300 text-2xl font-semibold mb-6 capitalize">
          {{ position }}
        </h3>

        <!-- PLAYER LIST (2 COLUMNS, SAFE) -->
        <div class="space-y-4 columns-1 md:columns-2">
          <ng-container
            *ngFor="let player of teamStatus?.selectedPositions[position]"
          >
            <div class="row">
              <div
                *ngIf="player?.id"
                class="flex items-center justify-between
                       bg-[#141414] rounded-xl
                       px-6 py-4
                       border border-gray-800
                       break-inside-avoid"
              >
                <div class="flex items-center space-x-4">
                  <img
                    [src]="player.image"
                    [alt]="player.name"
                    class="w-12 h-12 rounded-full
                           object-cover
                           border border-gray-700"
                  />
                  <span class="text-white text-3xl font-semibold">
                    {{ player.name }}
                  </span>
                </div>

                <span class="text-blue-400 text-3xl font-bold">
                  ₹{{ player.price }}
                </span>
              </div>
            </div>
          </ng-container>
        </div>
      </div>

    </div>
  </div>

  <!-- NEXT TEAM BUTTON -->
  <button
    class="next-team-btn"
    (click)="showNextTeam($event)"
    title="Next Team"
  >
    ▶
  </button>
</div>
