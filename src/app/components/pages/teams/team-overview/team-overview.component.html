<div class="relative h-screen w-full flex overflow-hidden bg-black">

  <!-- ================= LEFT : MANAGER HERO ================= -->
  <div
    class="relative w-[42%] flex items-end justify-center overflow-hidden"
    style="background: radial-gradient(circle at 50% 30%, #2a2a2a 0%, #0b0b0b 70%);"
  >

    <!-- Vignette -->
    <div class="absolute inset-0 bg-gradient-to-r from-black/70 via-transparent to-transparent"></div>

    <!-- Team color glow (very subtle) -->
    <div
      class="absolute bottom-0 left-1/2 -translate-x-1/2
           w-[70%] h-[30%] blur-3xl opacity-25"
      [style.background]="data?.team.primaryColor"
    ></div>

    <!-- Ground shadow -->
    <div
      class="absolute bottom-6 w-[55%] h-8 rounded-full blur-xl opacity-40"
      style="background:black"
    ></div>

    <!-- Manager Image -->
    <img
      [src]="data?.team?.manager?.displayImage"
      alt="Manager"
      class="relative z-10 h-[92%] object-contain animate-slide-in-left"
    />

    <!-- Team badge -->
    <div class="absolute bottom-8 left-8 z-20 flex items-center gap-4">
      <img
        [src]="data?.team.logo"
        class="w-16 h-16 object-contain"
      />
      <div
        class="h-12 w-1"
        [style.background]="data?.team.primaryColor"
      ></div>
    </div>
  </div>

  <!-- ================= RIGHT : LINEUPS ================= -->
  <div class="relative w-[58%] bg-[#f5f5f5] px-16 py-14 flex flex-col justify-center shadow-[-20px_0_40px_rgba(0,0,0,0.3)]">

    <!-- TOP BAR -->
    <div class="absolute top-0 left-0 w-full h-2"
         [style.background]="data?.team.primaryColor">
    </div>

    <!-- HEADER -->
    <div class="mb-10">
      <h1 class="text-5xl font-extrabold tracking-widest uppercase text-black">
        Lineups
      </h1>

      <div class="flex items-center gap-4 mt-3">
        <span
          class="block h-1 w-14"
          [style.background]="data?.team.primaryColor"
        ></span>
        <p class="text-3xl font-semibold uppercase tracking-wider text-gray-700">
          {{ data?.team.name }}
        </p>
      </div>
    </div>

    <!-- PLAYER LIST -->
    <div class="grid grid-cols-2 gap-x-20 gap-y-4 text-lg">

      <div
        *ngFor="let player of data?.team?.players; let i = index"
        class="flex items-center gap-4 opacity-0 animate-fade-up"
        [style.animationDelay]="(i * 70) + 'ms'"
      >
        <!-- NUMBER -->
        <span
          class="w-8 text-right font-bold"
          [style.color]="data?.team.primaryColor"
        >
          {{ i + 1 }}
        </span>

        <!-- NAME -->
        <span class="font-semibold text-gray-900 text-3xl tracking-wide">
          {{ player.name }}
        </span>

        <!-- CAPTAIN -->
        <span
          *ngIf="player.isCaptain"
          class="ml-1 font-bold text-lg"
          [style.color]="data?.team.primaryColor"
        >
          (C)
        </span>
      </div>

    </div>

    <!-- READY STATUS -->
    <div
      *ngIf="data?.team?.players?.length === 6"
      class="mt-12 inline-flex items-center gap-4 px-8 py-3 text-sm font-bold uppercase tracking-widest"
      [style.borderLeft]="'6px solid ' + data?.team.primaryColor"
      style="background:#eaeaea"
    >
      Ready for Kick-Off
    </div>

  </div>
</div>
