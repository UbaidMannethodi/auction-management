<ngx-loading
  [show]="loading.player || loading.team"
  [config]="{ backdropBorderRadius: '3px' }"
></ngx-loading>

<!-- ROOT -->
<div class="h-screen flex flex-col p-6 relative overflow-hidden page-container">

  <!-- ================= HEADER ================= -->
  <div
    class="relative flex items-center gap-6 mb-6 px-8 py-5
           rounded-2xl
           bg-gradient-to-r from-yellow-500/20 via-black/75 to-black/95
           border border-yellow-400/40
           shadow-xl"
  >
    <!-- Logo -->
    <div
      class="flex items-center justify-center
             bg-black/70 rounded-2xl p-4
             border border-yellow-400/50"
    >
      <img
        src="/images/icons/universal_upl_logo.png"
        alt="Logo"
        class="w-20 h-20 object-contain"
      />
    </div>

    <!-- Header Text -->
    <div class="leading-tight">
      <h1 class="text-4xl font-extrabold text-yellow-400 tracking-wide">
        UNIVERSAL ARTS & SPORTS
      </h1>
      <h2 class="text-lg font-semibold text-gray-300 tracking-widest uppercase">
        Premier League Mega Auction 2025
      </h2>
    </div>
  </div>

  <!-- ================= TEAM LIST ================= -->
  <div
    class="flex-shrink-0 grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-4
           gap-6 mb-6"
  >

    <div
      *ngFor="let t of teamService.teams; let i = index"
      class="relative rounded-2xl p-6
             bg-black/65 backdrop-blur-md
             border border-white/10
             shadow-lg
             transition-all duration-300
             hover:-translate-y-1 hover:shadow-2xl
             animate-card-enter"
      [style.animationDelay]="i * 80 + 'ms'"
    >

      <!-- TEAM COLOR ACCENT -->
      <div
        class="absolute left-0 top-0 h-full w-1.5 rounded-l-2xl"
        [ngStyle]="{ 'background-color': t.primaryColor }"
      ></div>

      <!-- LOGO + NAME -->
      <div class="flex items-center gap-5 mb-5">

        <div
          class="w-20 h-20 rounded-xl
                 bg-black/70 flex items-center justify-center
                 border border-white/15"
        >
          <img
            [src]="t.logo || '/images/icons/team_placeholder.png'"
            class="w-14 h-14 object-contain"
          />
        </div>

        <h2 class="text-3xl font-extrabold text-white leading-tight">
          {{ t.name }}
        </h2>
      </div>

      <!-- AMOUNT -->
      <div
        class="px-6 py-3 rounded-full inline-block
               bg-black/70 border border-white/15"
      >
        <p
          class="text-3xl font-extrabold tracking-wide"
          [ngClass]="{
            'text-green-400': teamService?.getTeamStatus(t)?.availableAmount >= 200,
            'text-red-400': teamService?.getTeamStatus(t)?.availableAmount < 200
          }"
        >
          ₹{{ teamService?.getTeamStatus(t)?.availableAmount }}
          <span class="text-gray-400 text-lg font-medium">
            / {{ teamService?.getTeamStatus(t)?.allocatedAmount }}
          </span>
        </p>
      </div>

      <!-- PLAYER COUNT -->
      <div
        *ngIf="t?.players?.length && t?.players?.length < 7"
        class="absolute bottom-3 right-3
               text-sm font-semibold
               px-4 py-1.5 rounded-full
               bg-blue-500/20 text-blue-300"
      >
        {{ t.players.length }} players
      </div>

      <!-- READY FOR KICK-OFF BADGE -->
      <div
        *ngIf="t?.players?.length >= 7"
        class="ready-badge"
      >
        ⚽ READY FOR KICK-OFF
      </div>

    </div>
  </div>

  <!-- ================= PLAYER TOKENS ================= -->
  <div
    class="flex-1 overflow-y-auto token-section
           rounded-2xl bg-black/45 shadow-xl p-6"
  >

    <div
      class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10
             gap-7"
    >
      <div
        *ngFor="let player of playerService.players"
        class="relative token-item
               h-28 w-28
               flex items-center justify-center
               rounded-2xl
               bg-black/75 border border-white/15
               cursor-pointer
               text-white text-2xl font-bold
               transition-all duration-300
               animate-token-float
               hover:scale-110 hover:shadow-[0_0_25px_rgba(255,215,0,0.6)]"
        [ngClass]="{
          'opacity-40': player?.price
        }"
        (dblclick)="openPlayerOverviewDialog(player)"
      >

        <!-- TOKEN NO -->
        <span class="opacity-70 text-4xl">
          {{ player.tokenNo }}
        </span>

        <!-- SOLD -->
        <div
          *ngIf="player?.price"
          class="absolute inset-0
                 flex items-center justify-center
                 text-red-500 text-5xl font-bold"
        >
          ✖
        </div>

      </div>
    </div>

  </div>

  <!-- NAVIGATION -->
  <button
    [routerLink]="'/players'"
    class="absolute right-6 bottom-6
           text-white text-3xl"
  >
    ▼
  </button>

</div>
